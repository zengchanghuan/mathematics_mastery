<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">正切减正弦的复合角三次缩放</title>
  <desc id="desc">基础结论是当u趋于零时，正切u减正弦u等价于二分之u三次方。把u换成二x时，整个二x必须立方，得到二分之八x三次方，也就是四x三次方。再除以x三次方，极限为四。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .base{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .sub{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .cube{fill:#faf5ff;stroke:#8b5cf6;stroke-width:3}
      .simplify{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
      .result{fill:#fef2f2;stroke:#ef4444;stroke-width:3}
      .arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" class="title">内部角换成 2x：三次主导项要把整个 2x 立方</text>

  <rect x="145" y="75" width="710" height="78" rx="16" class="base"/>
  <text x="500" y="108" text-anchor="middle" class="label">基础结论（把内部角统一叫作 u）</text>
  <text x="500" y="139" text-anchor="middle" class="formula">tan u − sin u ~ u³/2</text>

  <path d="M500 153 L500 188" class="arrow"/>

  <rect x="185" y="193" width="630" height="75" rx="16" class="sub"/>
  <text x="500" y="239" text-anchor="middle" class="formula">令 u = 2x</text>

  <path d="M500 268 L500 303" class="arrow"/>

  <rect x="125" y="308" width="750" height="90" rx="16" class="cube"/>
  <text x="500" y="342" text-anchor="middle" class="label">替换的是整个 u³</text>
  <text x="500" y="380" text-anchor="middle" class="formula">tan(2x) − sin(2x) ~ (2x)³/2</text>

  <path d="M500 398 L500 433" class="arrow"/>

  <rect x="125" y="438" width="750" height="75" rx="16" class="simplify"/>
  <text x="500" y="485" text-anchor="middle" class="formula">(2x)³/2 = 8x³/2 = 4x³</text>

  <path d="M500 513 L500 548" class="arrow"/>

  <rect x="175" y="553" width="650" height="55" rx="16" class="result"/>
  <text x="500" y="590" text-anchor="middle" class="formula">[tan(2x)−sin(2x)]/x³ → 4</text>
</svg>
