<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-labelledby="title desc">
  <title id="title">75度与15度的平均角和半差角</title>
  <desc id="desc">在角度数轴上，15度与75度关于45度对称。45度是平均角，从45度到两端的距离都是30度，因此半差角是30度。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .axis{stroke:#64748b;stroke-width:5}
      .tick{stroke:#0f172a;stroke-width:5}
      .mid{stroke:#2563eb;stroke-width:7}
      .distance{stroke:#8b5cf6;stroke-width:4;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .average{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .half{fill:#faf5ff;stroke:#8b5cf6;stroke-width:3}
      .warning{fill:#fff7ed;stroke:#f97316;stroke-width:3}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="980" height="570" fill="#ffffff"/>
  <text x="490" y="48" text-anchor="middle" class="title">先找中点，再量中点到端点的距离</text>

  <line x1="155" y1="155" x2="825" y2="155" class="axis"/>
  <line x1="230" y1="125" x2="230" y2="185" class="tick"/>
  <line x1="490" y1="115" x2="490" y2="195" class="mid"/>
  <line x1="750" y1="125" x2="750" y2="185" class="tick"/>
  <text x="230" y="110" text-anchor="middle" class="formula">15°</text>
  <text x="490" y="95" text-anchor="middle" class="formula" fill="#2563eb">45°</text>
  <text x="750" y="110" text-anchor="middle" class="formula">75°</text>
  <text x="490" y="225" text-anchor="middle" class="label">中点 = 平均角</text>

  <path d="M245 265 L475 265" class="distance"/>
  <path d="M505 265 L735 265" class="distance"/>
  <text x="360" y="250" text-anchor="middle" class="formula" fill="#7c3aed">30°</text>
  <text x="620" y="250" text-anchor="middle" class="formula" fill="#7c3aed">30°</text>
  <text x="490" y="300" text-anchor="middle" class="small">从中点到任一端点的距离 = 半差角</text>

  <rect x="75" y="335" width="390" height="105" rx="16" class="average"/>
  <text x="270" y="375" text-anchor="middle" class="label">平均角</text>
  <text x="270" y="414" text-anchor="middle" class="formula">(75°+15°)/2 = 45°</text>

  <rect x="515" y="335" width="390" height="105" rx="16" class="half"/>
  <text x="710" y="375" text-anchor="middle" class="label">半差角</text>
  <text x="710" y="414" text-anchor="middle" class="formula">(75°−15°)/2 = 30°</text>

  <rect x="120" y="470" width="740" height="70" rx="16" class="warning"/>
  <text x="490" y="512" text-anchor="middle" class="formula">90° 和 60° 只是“和”与“差”，还必须各除以 2</text>
</svg>
