<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">正弦和化积公式证明图</title>
  <desc id="desc">两个原角x和y关于平均角u对称，半差为v，因此x等于u加v，y等于u减v。反向使用正弦乘余弦的积化和差公式，得到正弦x加正弦y等于二倍正弦u乘余弦v。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .axis{stroke:#64748b;stroke-width:4}
      .tick{stroke:#0f172a;stroke-width:4}
      .mid{stroke:#2563eb;stroke-width:6}
      .box-angle{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .box-rewrite{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .box-known{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
      .box-result{fill:#faf5ff;stroke:#8b5cf6;stroke-width:3}
      .arrow{stroke:#8b5cf6;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" class="title">正弦和化积：平均角进 sin，半差角进 cos</text>

  <line x1="190" y1="130" x2="810" y2="130" class="axis"/>
  <line x1="290" y1="110" x2="290" y2="150" class="tick"/>
  <line x1="500" y1="100" x2="500" y2="160" class="mid"/>
  <line x1="710" y1="110" x2="710" y2="150" class="tick"/>
  <text x="290" y="90" text-anchor="middle" class="formula">y = u−v</text>
  <text x="500" y="85" text-anchor="middle" class="formula" fill="#2563eb">u</text>
  <text x="710" y="90" text-anchor="middle" class="formula">x = u+v</text>
  <text x="395" y="185" text-anchor="middle" class="label">距离 v</text>
  <text x="605" y="185" text-anchor="middle" class="label">距离 v</text>

  <rect x="100" y="215" width="800" height="80" rx="16" class="box-angle"/>
  <text x="500" y="248" text-anchor="middle" class="formula">u = (x+y)/2，v = (x−y)/2</text>
  <text x="500" y="277" text-anchor="middle" class="small">所以 x=u+v，y=u−v</text>

  <path d="M500 295 L500 325" class="arrow"/>

  <rect x="90" y="330" width="820" height="80" rx="16" class="box-rewrite"/>
  <text x="500" y="363" text-anchor="middle" class="formula">sin x + sin y = sin(u+v) + sin(u−v)</text>
  <text x="500" y="392" text-anchor="middle" class="small">两个角关于平均角 u 对称</text>

  <path d="M500 410 L500 440" class="arrow"/>

  <rect x="90" y="445" width="820" height="65" rx="16" class="box-known"/>
  <text x="500" y="486" text-anchor="middle" class="formula">sin(u+v) + sin(u−v) = 2 sin u cos v</text>

  <path d="M500 510 L500 535" class="arrow"/>

  <rect x="75" y="540" width="850" height="65" rx="16" class="box-result"/>
  <text x="500" y="581" text-anchor="middle" class="formula">sin x + sin y = 2 sin[(x+y)/2] cos[(x−y)/2]</text>
</svg>
