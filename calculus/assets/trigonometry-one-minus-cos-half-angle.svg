<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">一减余弦与半角平方的关系</title>
  <desc id="desc">左侧单位圆中的弦 AP 对应圆心角 x，中线把等腰三角形分成两个半角直角三角形；右侧分别计算弦长平方并得到一减余弦恒等式。</desc>
  <defs>
    <style>
      .axis{fill:none;stroke:#94a3b8;stroke-width:2}.circle{fill:none;stroke:#cbd5e1;stroke-width:3}
      .radius{fill:none;stroke:#2563eb;stroke-width:4}.chord{fill:none;stroke:#ea580c;stroke-width:5}
      .bisect{fill:none;stroke:#16a34a;stroke-width:4;stroke-dasharray:8 6}.arc{fill:none;stroke:#7c3aed;stroke-width:4}
      .point{fill:#0f172a}.label{font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .heading{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.result{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
    </style>
  </defs>
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="heading">同一条弦 AP，用两种方法计算</text>

  <rect x="30" y="75" width="470" height="480" rx="18" class="box"/>
  <text x="265" y="115" text-anchor="middle" class="heading">圆心角 x 被中线平分</text>
  <circle cx="250" cy="330" r="165" class="circle"/>
  <line x1="60" y1="330" x2="460" y2="330" class="axis"/>
  <line x1="250" y1="330" x2="415" y2="330" class="radius"/>
  <line x1="250" y1="330" x2="307" y2="175" class="radius"/>
  <line x1="415" y1="330" x2="307" y2="175" class="chord"/>
  <line x1="250" y1="330" x2="361" y2="252" class="bisect"/>
  <path d="M 310 330 A 60 60 0 0 0 271 274" class="arc"/>
  <circle cx="250" cy="330" r="6" class="point"/><circle cx="415" cy="330" r="6" class="point"/>
  <circle cx="307" cy="175" r="6" class="point"/><circle cx="361" cy="252" r="6" class="point"/>
  <text x="226" y="359" class="label">O</text><text x="423" y="346" class="label">A</text>
  <text x="287" y="165" class="label">P</text><text x="369" y="249" class="label">M</text>
  <text x="310" y="292" class="label">x</text><text x="303" y="326" class="small">x/2</text>
  <text x="344" y="217" class="label">AP</text><text x="319" y="370" class="small">OA=OP=1</text>
  <text x="265" y="515" text-anchor="middle" class="formula">AM=sin(x/2)，所以 AP=2sin(x/2)</text>

  <rect x="535" y="75" width="435" height="480" rx="18" class="box"/>
  <text x="752" y="115" text-anchor="middle" class="heading">比较两种弦长平方</text>
  <text x="570" y="174" class="formula">方法一：半角直角三角形</text>
  <text x="595" y="216" class="label">AP = 2sin(x/2)</text>
  <text x="595" y="254" class="label">AP² = 4sin²(x/2)</text>
  <line x1="570" y1="282" x2="930" y2="282" class="axis"/>
  <text x="570" y="330" class="formula">方法二：余弦定理</text>
  <text x="595" y="372" class="label">AP² = 1²+1²−2cos x</text>
  <text x="595" y="410" class="label">AP² = 2(1−cos x)</text>
  <line x1="570" y1="436" x2="930" y2="436" class="axis"/>
  <text x="570" y="474" class="small">两式计算同一条弦；令它们相等，再约去 2：</text>
  <rect x="565" y="494" width="375" height="45" rx="12" class="result"/>
  <text x="752" y="524" text-anchor="middle" class="formula">1−cos x = 2sin²(x/2)</text>
</svg>
