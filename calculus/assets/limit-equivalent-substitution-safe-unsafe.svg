<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" role="img" aria-labelledby="title desc">
  <title id="title">等价无穷小替换的安全结构与危险结构</title>
  <desc id="desc">等价无穷小在乘积和商中可以替换主要因子，但在加法和减法中若主要项抵消，等价关系不能告诉我们剩余项的大小。反例是x加x平方等价于x，但它与x的差实际为x平方，盲目替换却得到零。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .safe{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
      .danger{fill:#fef2f2;stroke:#ef4444;stroke-width:3}
      .example{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .rule{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1050" height="680" fill="#ffffff"/>
  <text x="525" y="48" text-anchor="middle" class="title">等价替换：乘除看主因子，加减先防抵消</text>

  <rect x="85" y="80" width="880" height="75" rx="16" class="rule"/>
  <text x="525" y="112" text-anchor="middle" class="label">若 f(x)~F(x)、g(x)~G(x)，等价只保证“相对大小趋于 1”</text>
  <text x="525" y="141" text-anchor="middle" class="small">它不自动记录两个接近量相减后剩下的更小部分</text>

  <path d="M525 155 L525 190" class="arrow"/>

  <rect x="55" y="195" width="450" height="170" rx="18" class="safe"/>
  <text x="280" y="235" text-anchor="middle" class="formula" fill="#15803d">通常安全：乘法与除法</text>
  <text x="280" y="278" text-anchor="middle" class="formula">f·g ~ F·G</text>
  <text x="280" y="318" text-anchor="middle" class="formula">f/g ~ F/G</text>
  <text x="280" y="350" text-anchor="middle" class="small">前提：相关分母在邻域内不为 0</text>

  <rect x="545" y="195" width="450" height="170" rx="18" class="danger"/>
  <text x="770" y="235" text-anchor="middle" class="formula" fill="#b91c1c">危险：加法与减法</text>
  <text x="770" y="280" text-anchor="middle" class="formula">f±g 不能只凭等价逐项替换</text>
  <text x="770" y="320" text-anchor="middle" class="label">若主要项抵消，剩余阶数会改变</text>
  <text x="770" y="350" text-anchor="middle" class="small">需要因式分解、恒等变形或更精细展开</text>

  <path d="M770 365 L770 410" class="arrow"/>

  <rect x="120" y="415" width="810" height="165" rx="18" class="example"/>
  <text x="525" y="454" text-anchor="middle" class="formula">反例：x+x² ~ x，同时 x ~ x</text>
  <text x="525" y="500" text-anchor="middle" class="formula">实际：(x+x²)−x = x²</text>
  <text x="525" y="542" text-anchor="middle" class="formula">盲目逐项替换：x−x = 0　← 丢失了 x²</text>
  <text x="525" y="570" text-anchor="middle" class="small">所以“各自等价”不代表“相减后仍可等价替换”</text>

  <rect x="170" y="605" width="710" height="55" rx="15" class="rule"/>
  <text x="525" y="641" text-anchor="middle" class="formula">先看结构：乘/除 → 可考虑替换；加/减 → 先查抵消</text>
</svg>
