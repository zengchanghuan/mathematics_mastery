<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc">
  <title id="title">把分母分配给标准极限模块</title>
  <desc id="desc">从正弦x乘一减余弦x再除以x三次方余弦x出发。看到正弦x就为它配x，看到一减余弦x就为它配二分之x平方。因为x乘二分之x平方再乘二倍余弦x恰好等于x三次方余弦x，所以剩余因子是一除以二倍余弦x。三个因子分别趋于一、一和二分之一。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .start{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .denom{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .sinbox{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
      .cosbox{fill:#faf5ff;stroke:#8b5cf6;stroke-width:3}
      .restbox{fill:#fef2f2;stroke:#ef4444;stroke-width:3}
      .result{fill:#f8fafc;stroke:#64748b;stroke-width:3}
      .arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1080" height="690" fill="#ffffff"/>
  <text x="540" y="46" text-anchor="middle" class="title">不是猜展开式：按标准极限给分子“配分母”</text>

  <rect x="135" y="75" width="810" height="85" rx="16" class="start"/>
  <text x="540" y="108" text-anchor="middle" class="label">恒等变形后得到</text>
  <text x="540" y="143" text-anchor="middle" class="formula">sin x · (1−cos x) / [x³ cos x]</text>

  <path d="M540 160 L540 195" class="arrow"/>

  <rect x="105" y="200" width="870" height="100" rx="16" class="denom"/>
  <text x="540" y="237" text-anchor="middle" class="label">把原分母精确拆成三块</text>
  <text x="540" y="276" text-anchor="middle" class="formula">x³ cos x = x · (x²/2) · (2 cos x)</text>

  <path d="M540 300 L540 335" class="arrow"/>

  <rect x="35" y="340" width="310" height="125" rx="16" class="sinbox"/>
  <text x="190" y="378" text-anchor="middle" class="label">看到 sin x</text>
  <text x="190" y="417" text-anchor="middle" class="formula">配上 x</text>
  <text x="190" y="449" text-anchor="middle" class="formula">sin x/x → 1</text>

  <rect x="385" y="340" width="310" height="125" rx="16" class="cosbox"/>
  <text x="540" y="378" text-anchor="middle" class="label">看到 1−cos x</text>
  <text x="540" y="417" text-anchor="middle" class="formula">配上 x²/2</text>
  <text x="540" y="449" text-anchor="middle" class="formula">(1−cos x)/(x²/2) → 1</text>

  <rect x="735" y="340" width="310" height="125" rx="16" class="restbox"/>
  <text x="890" y="378" text-anchor="middle" class="label">剩余分母</text>
  <text x="890" y="417" text-anchor="middle" class="formula">2 cos x</text>
  <text x="890" y="449" text-anchor="middle" class="formula">1/(2 cos x) → 1/2</text>

  <path d="M190 465 C190 510 390 510 500 540" class="arrow"/>
  <path d="M540 465 L540 535" class="arrow"/>
  <path d="M890 465 C890 510 690 510 580 540" class="arrow"/>

  <rect x="70" y="545" width="940" height="90" rx="16" class="result"/>
  <text x="540" y="580" text-anchor="middle" class="formula">(sin x/x) · [(1−cos x)/(x²/2)] · [1/(2 cos x)]</text>
  <text x="540" y="617" text-anchor="middle" class="formula">→ 1 · 1 · 1/2 = 1/2</text>

  <text x="540" y="670" text-anchor="middle" class="label">检查诀窍：三个新分母相乘，必须精确还原原分母 x³ cos x</text>
</svg>
