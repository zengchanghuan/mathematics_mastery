<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">正切x等价于x的证明链</title>
  <desc id="desc">要证明正切x等价于x，考察正切x除以x。利用正切等于正弦除以余弦，把比值拆成正弦x除以x乘以余弦x的倒数。第一个因子趋于一，第二个因子也趋于一，因此乘积趋于一。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .box-goal{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .box-rewrite{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .box-left{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
      .box-right{fill:#faf5ff;stroke:#8b5cf6;stroke-width:3}
      .box-result{fill:#fef2f2;stroke:#ef4444;stroke-width:3}
      .arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" class="title">tan x ~ x：拆成两个都趋于 1 的因子</text>

  <rect x="150" y="75" width="700" height="80" rx="16" class="box-goal"/>
  <text x="500" y="108" text-anchor="middle" class="label">证明等价：考察比值</text>
  <text x="500" y="140" text-anchor="middle" class="formula">lim [tan x / x]</text>

  <path d="M500 155 L500 195" class="arrow"/>

  <rect x="100" y="200" width="800" height="90" rx="16" class="box-rewrite"/>
  <text x="500" y="235" text-anchor="middle" class="label">使用 tan x = sin x / cos x</text>
  <text x="500" y="273" text-anchor="middle" class="formula">tan x / x = (sin x / x) · (1 / cos x)</text>

  <path d="M500 290 L500 330" class="arrow"/>

  <rect x="70" y="335" width="400" height="115" rx="16" class="box-left"/>
  <text x="270" y="372" text-anchor="middle" class="label">第一个重要极限</text>
  <text x="270" y="410" text-anchor="middle" class="formula">sin x / x → 1</text>
  <text x="270" y="437" text-anchor="middle" class="small">x 必须使用弧度</text>

  <rect x="530" y="335" width="400" height="115" rx="16" class="box-right"/>
  <text x="730" y="372" text-anchor="middle" class="label">余弦的连续性</text>
  <text x="730" y="410" text-anchor="middle" class="formula">cos x → 1</text>
  <text x="730" y="437" text-anchor="middle" class="small">所以 1/cos x → 1</text>

  <path d="M270 450 C270 500 430 500 480 530" class="arrow"/>
  <path d="M730 450 C730 500 570 500 520 530" class="arrow"/>

  <rect x="160" y="535" width="680" height="85" rx="16" class="box-result"/>
  <text x="500" y="570" text-anchor="middle" class="formula">lim [tan x / x] = 1·1 = 1</text>
  <text x="500" y="604" text-anchor="middle" class="formula">因此 tan x ~ x　(x→0)</text>
</svg>
