<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">余弦差角公式的直角三角形投影证明</title>
  <desc id="desc">单位边 OP 与横轴夹角为 a，射线 OH 与横轴夹角为 b。点 P 和点 Q 分别向射线作垂线，垂足为 H 和 R；补出平行四边形 QPSR。三个直角三角形说明 OH 同时等于 cos(a-b)，以及 cos a cos b 加 sin a sin b。</desc>
  <defs>
    <style>
      .axis{fill:none;stroke:#94a3b8;stroke-width:2}
      .guide{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}
      .unit{fill:none;stroke:#2563eb;stroke-width:5}
      .horizontal{fill:none;stroke:#ea580c;stroke-width:6}
      .vertical{fill:none;stroke:#16a34a;stroke-width:6}
      .arc{fill:none;stroke:#7c3aed;stroke-width:4}
      .point{fill:#0f172a}
      .label{font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .heading{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="920" height="620" fill="#ffffff"/>
  <text x="460" y="42" text-anchor="middle" class="heading">把同一条投影 OH 分成两段</text>

  <line x1="90" y1="455" x2="490" y2="455" class="axis"/>
  <line x1="90" y1="455" x2="430" y2="259" class="axis"/>
  <text x="438" y="258" class="small">b 方向</text>

  <line x1="90" y1="455" x2="240" y2="195" class="unit"/>
  <line x1="90" y1="455" x2="240" y2="455" class="horizontal"/>
  <line x1="240" y1="455" x2="240" y2="195" class="vertical"/>

  <line x1="240" y1="455" x2="203" y2="390" class="guide"/>
  <line x1="203" y1="130" x2="315" y2="325" class="guide"/>
  <line x1="203" y1="390" x2="203" y2="130" class="vertical"/>
  <line x1="90" y1="455" x2="203" y2="390" class="horizontal"/>
  <line x1="203" y1="390" x2="315" y2="325" class="vertical"/>

  <polyline points="193,396 199,407 209,401" class="axis"/>
  <polyline points="305,331 311,342 321,336" class="axis"/>

  <path d="M 137 455 A 47 47 0 0 0 131 431" class="axis"/>
  <path d="M 143 424 A 61 61 0 0 0 121 402" class="arc"/>
  <text x="126" y="443" class="small">b</text>
  <text x="144" y="402" class="small">a−b</text>

  <circle cx="90" cy="455" r="6" class="point"/>
  <circle cx="240" cy="195" r="6" class="point"/>
  <circle cx="240" cy="455" r="6" class="point"/>
  <circle cx="203" cy="390" r="6" class="point"/>
  <circle cx="203" cy="130" r="6" class="point"/>
  <circle cx="315" cy="325" r="6" class="point"/>

  <text x="68" y="485" class="label">O</text>
  <text x="249" y="187" class="label">P</text>
  <text x="250" y="481" class="label">Q</text>
  <text x="210" y="414" class="label">R</text>
  <text x="176" y="123" class="label">S</text>
  <text x="326" y="323" class="label">H</text>

  <text x="148" y="300" class="small">OP = 1</text>
  <text x="145" y="482" class="small">OQ = cos a</text>
  <text x="251" y="294" class="small">QP = sin a</text>
  <text x="112" y="426" class="small">OR</text>
  <text x="250" y="354" class="small">RH</text>
  <text x="208" y="264" class="small">RS = sin a</text>

  <rect x="500" y="75" width="365" height="425" rx="18" class="box"/>
  <text x="682" y="120" text-anchor="middle" class="heading">三个直角三角形</text>

  <text x="535" y="170" class="formula">① △OPH：</text>
  <text x="560" y="204" class="label">OH = OP cos(a−b)</text>
  <text x="560" y="236" class="label">= cos(a−b)</text>

  <text x="535" y="286" class="formula">② △OQR：</text>
  <text x="535" y="320" class="small">OR = OQ cos b = cos a cos b</text>

  <text x="535" y="370" class="formula">③ 平行四边形 QPSR：</text>
  <text x="560" y="402" class="small">RS = QP = sin a</text>
  <text x="535" y="438" class="formula">△RSH：</text>
  <text x="560" y="470" class="small">RH = RS cos(90°−b) = sin a sin b</text>

  <rect x="105" y="525" width="710" height="62" rx="14" class="box"/>
  <text x="460" y="565" text-anchor="middle" class="formula">OH = OR + RH  ⇒  cos(a−b) = cos a cos b + sin a sin b</text>
</svg>
