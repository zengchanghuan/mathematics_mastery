<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">正弦和角公式的余函数推导</title>
  <desc id="desc">左侧直角三角形说明正弦等于余角的余弦，右侧把正弦和角转换成余弦差角并逐步推导。</desc>
  <defs>
    <style>
      .axis{fill:none;stroke:#94a3b8;stroke-width:2}
      .side{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}
      .height{fill:none;stroke:#ea580c;stroke-width:5;stroke-linecap:round}
      .hyp{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round}
      .arc{fill:none;stroke:#7c3aed;stroke-width:4}
      .point{fill:#0f172a}
      .label{font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .heading{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .formula{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .note{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
    </style>
  </defs>

  <rect width="980" height="600" fill="#ffffff"/>
  <text x="490" y="42" text-anchor="middle" class="heading">先把 sin 变成“余角的 cos”</text>

  <rect x="35" y="75" width="430" height="475" rx="18" class="box"/>
  <text x="250" y="117" text-anchor="middle" class="heading">同一个直角三角形</text>

  <line x1="105" y1="455" x2="385" y2="455" class="side"/>
  <line x1="385" y1="455" x2="385" y2="190" class="height"/>
  <line x1="105" y1="455" x2="385" y2="190" class="hyp"/>
  <path d="M 155 455 A 50 50 0 0 0 141 421" class="arc"/>
  <path d="M 385 242 A 52 52 0 0 0 347 226" class="arc"/>
  <path d="M 365 455 L 365 435 L 385 435" class="axis"/>

  <circle cx="105" cy="455" r="6" class="point"/>
  <circle cx="385" cy="455" r="6" class="point"/>
  <circle cx="385" cy="190" r="6" class="point"/>

  <text x="78" y="485" class="label">O</text>
  <text x="394" y="485" class="label">Q</text>
  <text x="395" y="185" class="label">P</text>
  <text x="156" y="424" class="label">θ</text>
  <text x="292" y="226" class="small">90°−θ</text>
  <text x="222" y="486" class="label">cos θ</text>
  <text x="397" y="335" class="label">sin θ</text>
  <text x="214" y="310" class="label">斜边 OP=1</text>

  <rect x="80" y="503" width="340" height="40" rx="12" class="note"/>
  <text x="250" y="530" text-anchor="middle" class="formula">sin θ = cos(90°−θ)</text>

  <rect x="500" y="75" width="445" height="475" rx="18" class="box"/>
  <text x="722" y="117" text-anchor="middle" class="heading">把和角转成差角</text>

  <text x="535" y="176" class="formula">sin(a+b)</text>
  <text x="535" y="222" class="label">= cos[90°−(a+b)]</text>
  <text x="535" y="268" class="label">= cos[(90°−a)−b]</text>

  <line x1="535" y1="294" x2="905" y2="294" class="axis"/>
  <text x="535" y="337" class="small">使用 cos(X−b)=cos X cos b+sin X sin b</text>
  <text x="535" y="385" class="label">= cos(90°−a) cos b</text>
  <text x="555" y="425" class="label">+ sin(90°−a) sin b</text>

  <text x="535" y="473" class="small">cos(90°−a)=sin a，sin(90°−a)=cos a</text>
  <rect x="525" y="494" width="395" height="45" rx="12" class="note"/>
  <text x="722" y="524" text-anchor="middle" class="formula">sin(a+b)=sin a cos b+cos a sin b</text>
</svg>
