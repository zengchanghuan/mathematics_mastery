<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">正弦导数的单位圆切向速度直观</title>
  <desc id="desc">单位圆上点 P 的纵坐标是 sin x。角度以弧度增加时，点沿切线运动，切向速度向量的竖直分量是 cos x，因此正弦的导数是 cos x。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { fill: #0f172a; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { fill: #0f172a; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #475569; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .math { fill: #0f172a; font: 23px Georgia, "Times New Roman", serif; }
      .accent { fill: #b91c1c; font: 700 21px Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <rect width="1100" height="680" fill="#f8fafc"/>
  <text x="42" y="50" class="title">正弦的导数：圆上点的“竖直速度”</text>

  <rect x="40" y="82" width="625" height="555" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="85" y1="360" x2="625" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="600" x2="315" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="603" y="390" class="math">X</text>
  <text x="332" y="128" class="math">Y</text>

  <circle cx="315" cy="360" r="205" fill="#eff6ff" fill-opacity="0.55" stroke="#2563eb" stroke-width="4"/>
  <circle cx="315" cy="360" r="5" fill="#0f172a"/>
  <text x="290" y="390" class="math">O</text>

  <line x1="315" y1="360" x2="472" y2="228" stroke="#2563eb" stroke-width="4"/>
  <circle cx="472" cy="228" r="8" fill="#2563eb"/>
  <text x="487" y="216" class="math">P=(cos x, sin x)</text>

  <path d="M390 360 A75 75 0 0 0 372 312" fill="none" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="337" class="math">x</text>
  <text x="378" y="405" class="small">单位圆：弧长 = 弧度</text>

  <line x1="472" y1="228" x2="382" y2="121" stroke="#dc2626" stroke-width="5" marker-end="url(#redArrow)"/>
  <text x="362" y="98" class="accent">切向速度 (-sin x, cos x)</text>

  <line x1="472" y1="228" x2="472" y2="121" stroke="#16a34a" stroke-width="4" stroke-dasharray="9 7"/>
  <line x1="472" y1="121" x2="382" y2="121" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="487" y="172" class="accent">竖直分量 cos x</text>
  <text x="400" y="148" class="small">水平分量 -sin x</text>

  <line x1="472" y1="228" x2="315" y2="228" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="325" y="216" class="math">高度 = sin x</text>

  <rect x="700" y="105" width="355" height="155" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="728" y="143" class="head">看纵坐标</text>
  <text x="728" y="181" class="body">sin x 是点 P 的高度。</text>
  <text x="728" y="217" class="body">高度变化率就是竖直速度。</text>

  <rect x="700" y="290" width="355" height="155" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="728" y="328" class="head">看切向运动</text>
  <text x="728" y="366" class="body">角度每增加 1 弧度，</text>
  <text x="728" y="402" class="body">点沿圆周前进单位弧长。</text>

  <rect x="700" y="475" width="355" height="130" rx="20" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="878" y="518" text-anchor="middle" class="head">几何预期</text>
  <text x="878" y="568" text-anchor="middle" class="math">d(sin x)/dx = cos x</text>
</svg>
