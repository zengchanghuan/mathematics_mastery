<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">链式法则的两级变化率流程</title>
  <desc id="desc">输入 x 先经过内层函数 g 变成 u，再经过外层函数 f 变成 y。微小变化依次乘以内层导数和外层导数，因此总变化率是二者乘积。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { fill: #0f172a; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { fill: #0f172a; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .math { fill: #0f172a; font: 25px Georgia, "Times New Roman", serif; }
      .rate { fill: #b91c1c; font: 700 21px Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <rect width="1080" height="500" fill="#f8fafc"/>
  <text x="42" y="48" class="title">链式法则：变化率经过两道函数机器</text>

  <rect x="60" y="105" width="190" height="105" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="155" y="150" text-anchor="middle" class="head">输入</text>
  <text x="155" y="187" text-anchor="middle" class="math">x</text>

  <path d="M266 158H410" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="338" y="132" text-anchor="middle" class="body">内层 g</text>
  <text x="338" y="190" text-anchor="middle" class="rate">du/dx = g′(x)</text>

  <rect x="425" y="105" width="190" height="105" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="520" y="150" text-anchor="middle" class="head">中间量</text>
  <text x="520" y="187" text-anchor="middle" class="math">u=g(x)</text>

  <path d="M631 158H775" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="703" y="132" text-anchor="middle" class="body">外层 f</text>
  <text x="703" y="190" text-anchor="middle" class="rate">dy/du = f′(u)</text>

  <rect x="790" y="105" width="230" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="905" y="150" text-anchor="middle" class="head">输出</text>
  <text x="905" y="187" text-anchor="middle" class="math">y=f(u)=f(g(x))</text>

  <rect x="60" y="265" width="960" height="95" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="304" class="body">微小输入变化</text>
  <text x="238" y="304" class="math">Δx</text>
  <text x="305" y="304" class="body">先产生</text>
  <text x="395" y="304" class="math">Δu ≈ g′(x)Δx</text>
  <text x="604" y="304" class="body">再产生</text>
  <text x="694" y="304" class="math">Δy ≈ f′(u)Δu</text>
  <text x="92" y="341" class="body">所以两级倍率相乘，而不是相加。</text>

  <rect x="225" y="392" width="630" height="76" rx="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="540" y="441" text-anchor="middle" class="math">dy/dx = (dy/du)(du/dx) = f′(g(x)) · g′(x)</text>
</svg>
