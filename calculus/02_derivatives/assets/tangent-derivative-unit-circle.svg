<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">正切是单位圆右侧切线上的高度</title>
  <desc id="desc">从圆心按角度 x 发出的射线与单位圆右侧的竖直切线 X=1 相交于 T。交点 T 相对横轴的高度是 tan x，圆心到 T 的长度是 sec x。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { fill: #0f172a; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { fill: #0f172a; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #475569; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .math { fill: #0f172a; font: 23px Georgia, "Times New Roman", serif; }
      .accent { fill: #b91c1c; font: 700 21px Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <rect width="1100" height="680" fill="#f8fafc"/>
  <text x="42" y="50" class="title">正切：单位圆右侧切线上的高度</text>

  <rect x="40" y="82" width="635" height="555" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="82" y1="390" x2="640" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="600" x2="300" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="616" y="420" class="math">X</text>
  <text x="317" y="132" class="math">Y</text>

  <circle cx="300" cy="390" r="180" fill="#eff6ff" fill-opacity="0.58" stroke="#2563eb" stroke-width="4"/>
  <circle cx="300" cy="390" r="5" fill="#0f172a"/>
  <text x="276" y="422" class="math">O</text>

  <line x1="480" y1="590" x2="480" y2="105" stroke="#dc2626" stroke-width="4"/>
  <text x="495" y="128" class="accent">切线 X=1</text>

  <line x1="300" y1="390" x2="480" y2="239" stroke="#7c3aed" stroke-width="5"/>
  <circle cx="438" cy="274" r="7" fill="#2563eb"/>
  <circle cx="480" cy="239" r="8" fill="#dc2626"/>
  <text x="402" y="300" class="math">P</text>
  <text x="496" y="228" class="math">T=(1, tan x)</text>

  <path d="M378 390 A78 78 0 0 0 360 340" fill="none" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="382" y="365" class="math">x</text>

  <line x1="480" y1="390" x2="480" y2="239" stroke="#16a34a" stroke-width="8"/>
  <line x1="468" y1="390" x2="492" y2="390" stroke="#16a34a" stroke-width="3"/>
  <line x1="468" y1="239" x2="492" y2="239" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="320" class="accent">高度 = tan x</text>

  <text x="338" y="245" class="accent">OT = sec x</text>
  <text x="352" y="452" class="small">单位半径 OP = 1</text>

  <rect x="710" y="112" width="345" height="150" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="738" y="151" class="head">为什么是 tan x</text>
  <text x="738" y="190" class="body">横坐标固定为 1，</text>
  <text x="738" y="225" class="math">高度/1 = tan x</text>

  <rect x="710" y="296" width="345" height="150" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="738" y="335" class="head">接近竖直时</text>
  <text x="738" y="374" class="body">小角度变化会使交点 T</text>
  <text x="738" y="409" class="body">沿切线快速远离。</text>

  <rect x="710" y="480" width="345" height="125" rx="20" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="882" y="521" text-anchor="middle" class="head">待严格证明</text>
  <text x="882" y="568" text-anchor="middle" class="math">d(tan x)/dx = sec²x</text>
</svg>
