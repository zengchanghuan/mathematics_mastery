<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">割线逼近切线</title>
  <desc id="desc">在抛物线 y 等于 x 平方上，点 Q 沿曲线靠近点 P，一条割线逐渐逼近点 P 处斜率为二的切线。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; font-size: 15px; }
    .frame, .axis { fill: none; stroke: #9aa0a6; stroke-width: 1.2; }
    .curve { fill: none; stroke: #2767c5; stroke-width: 3; }
    .secant { stroke: #d56b19; stroke-width: 3; }
    .tangent { stroke: #258650; stroke-width: 3; }
    .triangle { fill: none; stroke: #d56b19; stroke-width: 1.8; stroke-dasharray: 6 5; }
    .p { fill: #258650; }
    .q { fill: #d56b19; }
    .label { font-weight: 600; }
  </style>
  <rect class="frame" x="70" y="35" width="620" height="325"/>
  <line class="axis" x1="70" y1="325" x2="690" y2="325"/>
  <line class="axis" x1="111" y1="35" x2="111" y2="360"/>
  <path class="curve" d="M70 322 L111 324 L215 315 L318 288 L421 243 L525 179 L628 98 L690 41"/>
  <line class="secant" x1="180" y1="360" x2="690" y2="93"/>
  <line class="tangent" x1="111" y1="360" x2="690" y2="158"/>
  <path class="triangle" d="M318 288 L525 288 L525 179"/>
  <circle class="p" cx="318" cy="288" r="6"/>
  <circle class="q" cx="525" cy="179" r="6"/>
  <text class="label" x="300" y="317" text-anchor="end">P(1,1)</text>
  <text class="label" x="538" y="169">Q(2,4)</text>
  <text class="label" x="555" y="60">f(x)=x²</text>
  <text class="label" x="120" y="334">割线斜率 = 3</text>
  <text class="label" x="460" y="255">切线斜率 = 2</text>
  <text x="420" y="310" text-anchor="middle">横向变化 h=1</text>
  <text x="535" y="240">纵向变化 3</text>
</svg>
