<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">函数一除以 x 减 2 的无穷极限</title>
  <desc id="desc">x 等于 2 是竖直渐近线。从左侧靠近 2 时函数趋向负无穷，从右侧靠近 2 时函数趋向正无穷。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">f(x)=1/(x−2)：从两侧靠近 x=2</text>

  <rect x="90" y="65" width="720" height="365" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="90" y1="248" x2="810" y2="248" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="65" x2="180" y2="430" stroke="#64748b" stroke-width="2"/>
  <text x="820" y="254" font-family="sans-serif" font-size="18" fill="#334155">x</text>
  <text x="163" y="82" font-family="sans-serif" font-size="18" fill="#334155">y</text>

  <line x1="450" y1="65" x2="450" y2="430" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="464" y="91" font-family="sans-serif" font-size="18" font-weight="700" fill="#dc2626">x=2</text>
  <text x="464" y="116" font-family="sans-serif" font-size="16" fill="#dc2626">竖直渐近线</text>

  <path d="M90 278 C180 284 270 296 335 330 C385 356 418 393 438 425" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M462 70 C482 107 515 141 565 168 C630 202 720 214 810 220" fill="none" stroke="#2563eb" stroke-width="5" marker-start="url(#arrow-blue)"/>

  <path d="M355 380 C390 406 419 421 439 428" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M545 139 C510 112 481 89 462 72" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <text x="305" y="397" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">x→2⁻</text>
  <text x="305" y="424" text-anchor="end" font-family="sans-serif" font-size="20" font-weight="700" fill="#2563eb">f(x)→−∞</text>
  <text x="595" y="90" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">x→2⁺</text>
  <text x="595" y="117" font-family="sans-serif" font-size="20" font-weight="700" fill="#2563eb">f(x)→+∞</text>

  <g font-family="sans-serif" font-size="16" fill="#334155" text-anchor="middle">
    <line x1="180" y1="242" x2="180" y2="254" stroke="#64748b" stroke-width="2"/><text x="180" y="275">0</text>
    <line x1="315" y1="242" x2="315" y2="254" stroke="#64748b" stroke-width="2"/><text x="315" y="275">1</text>
    <line x1="450" y1="242" x2="450" y2="254" stroke="#64748b" stroke-width="2"/><text x="450" y="275">2</text>
    <line x1="585" y1="242" x2="585" y2="254" stroke="#64748b" stroke-width="2"/><text x="585" y="275">3</text>
    <line x1="720" y1="242" x2="720" y2="254" stroke="#64748b" stroke-width="2"/><text x="720" y="275">4</text>
  </g>

  <rect x="180" y="452" width="540" height="32" rx="8" fill="#eff6ff"/>
  <text x="450" y="474" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">关键：分母从负的极小数变为正的极小数，方向因此相反</text>
</svg>
