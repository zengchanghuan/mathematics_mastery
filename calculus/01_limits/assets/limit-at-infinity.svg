<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">函数一除以 x 在无穷远处趋向零</title>
  <desc id="desc">随着 x 越来越大，一除以 x 的函数值越来越接近零，y 等于零是水平渐近线。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">x 越来越大时，f(x)=1/x 去哪里？</text>
  <rect x="95" y="70" width="710" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="95" y1="390" x2="805" y2="390" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="130" y1="70" x2="130" y2="410" stroke="#64748b" stroke-width="2"/>
  <text x="815" y="398" font-family="sans-serif" font-size="18" fill="#334155">x</text>
  <text x="112" y="88" font-family="sans-serif" font-size="18" fill="#334155">y</text>
  <text x="650" y="378" font-family="sans-serif" font-size="19" font-weight="700" fill="#dc2626">水平渐近线 y=0</text>

  <path d="M145 90 C165 210 190 280 230 325 C300 365 450 382 790 388" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>

  <g font-family="sans-serif" font-size="17" fill="#334155" text-anchor="middle">
    <circle cx="175" cy="240" r="6" fill="#f59e0b"/><text x="175" y="222">x=2，f(x)=0.5</text>
    <circle cx="270" cy="345" r="6" fill="#f59e0b"/><text x="270" y="327">x=10，f(x)=0.1</text>
    <circle cx="690" cy="386" r="6" fill="#f59e0b"/><text x="690" y="354">x=100，f(x)=0.01</text>
  </g>

  <path d="M560 315 C640 320 715 335 770 370" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="306" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">越来越接近 0，但不会等于 0</text>
  <rect x="180" y="438" width="540" height="38" rx="8" fill="#eff6ff"/>
  <text x="450" y="464" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">lim x→+∞ 1/x = 0</text>
</svg>
