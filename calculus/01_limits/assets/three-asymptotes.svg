<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">竖直、水平与斜渐近线的统一比较</title>
  <desc id="desc">左图表示 x 靠近二时函数贴近竖线 x 等于二；中图表示 x 跑向无穷时函数贴近横线 y 等于二；右图表示 x 跑向无穷时函数贴近斜线 y 等于 x。</desc>
  <style>
    .bg { fill: #fffdf8; }
    .frame, .axis, .grid { fill: none; stroke: #c9c1b6; stroke-width: 1.5; }
    .grid { opacity: .45; }
    .curve { fill: none; stroke: #d96b24; stroke-width: 4; stroke-linecap: round; }
    .asym { fill: none; stroke: #168aad; stroke-width: 4; stroke-dasharray: 10 8; }
    .main { fill: #241d17; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #6e6258; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .curve-text { fill: #b64e0b; font-family: "Times New Roman", "STIX Two Math", serif; font-weight: 700; }
    .asym-text { fill: #08799b; font-family: "Times New Roman", "STIX Two Math", serif; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171717; }
      .frame, .axis, .grid { stroke: #554d46; }
      .curve { stroke: #ff9f43; }
      .asym { stroke: #66d9ef; }
      .main { fill: #f7ede2; }
      .muted { fill: #c4b7aa; }
      .curve-text { fill: #ffb56b; }
      .asym-text { fill: #89e4f4; }
    }
  </style>

  <rect class="bg" width="1200" height="470" rx="24"/>
  <text class="main" x="40" y="52" font-size="30" font-weight="700">三种渐近线：本质都是“图像越来越贴近一条直线”</text>

  <g aria-label="竖直渐近线">
    <text class="main" x="55" y="94" font-size="24" font-weight="700">竖直：x 靠近 2</text>
    <rect class="frame" x="55" y="112" width="330" height="248"/>
    <line class="grid" x1="55" y1="236" x2="385" y2="236"/>
    <line class="axis" x1="220" y1="112" x2="220" y2="360"/>
    <line class="axis" x1="55" y1="236" x2="385" y2="236"/>
    <line class="asym" x1="290" y1="112" x2="290" y2="360"/>
    <path class="curve" d="M70 220 C140 222 205 230 245 252 C270 268 281 309 285 350"/>
    <path class="curve" d="M295 122 C299 165 310 198 330 211 C347 220 365 224 380 226"/>
    <text class="curve-text" x="74" y="139" font-size="21">f(x)=1/(x−2)</text>
    <text class="asym-text" x="300" y="345" font-size="22">x=2</text>
    <text class="muted" x="55" y="399" font-size="20">x → 2，|y| 越来越大</text>
  </g>

  <g aria-label="水平渐近线">
    <text class="main" x="435" y="94" font-size="24" font-weight="700">水平：x 跑向无穷远</text>
    <rect class="frame" x="435" y="112" width="330" height="248"/>
    <line class="axis" x1="600" y1="112" x2="600" y2="360"/>
    <line class="grid" x1="435" y1="236" x2="765" y2="236"/>
    <line class="asym" x1="435" y1="282" x2="765" y2="282"/>
    <path class="curve" d="M442 277 C505 272 553 251 575 178 C584 145 592 125 600 125 C608 125 616 145 625 178 C647 251 695 272 758 277"/>
    <text class="curve-text" x="450" y="139" font-size="20">f(x)=2+1/(x²+1)</text>
    <text class="asym-text" x="708" y="273" font-size="22">y=2</text>
    <text class="muted" x="435" y="399" font-size="20">|x| → ∞，y → 2</text>
  </g>

  <g aria-label="斜渐近线">
    <text class="main" x="815" y="94" font-size="24" font-weight="700">斜线：x 跑向无穷远</text>
    <rect class="frame" x="815" y="112" width="330" height="248"/>
    <line class="axis" x1="980" y1="112" x2="980" y2="360"/>
    <line class="axis" x1="815" y1="236" x2="1145" y2="236"/>
    <line class="asym" x1="825" y1="350" x2="1135" y2="122"/>
    <path class="curve" d="M825 348 C890 301 938 269 965 252 C985 238 1000 216 1018 197 C1048 165 1090 137 1135 124"/>
    <text class="curve-text" x="828" y="139" font-size="20">f(x)=x+1/(x²+1)</text>
    <text class="asym-text" x="1086" y="156" font-size="22">y=x</text>
    <text class="muted" x="815" y="399" font-size="20">|x| → ∞，f(x)−x → 0</text>
  </g>

  <text class="main" x="600" y="447" text-anchor="middle" font-size="22" font-weight="700">先看 x 往哪里走，再看图像贴近竖线、横线还是斜线</text>
</svg>
