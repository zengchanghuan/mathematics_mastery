<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">一致连续与只连续的对比</title>
  <desc id="desc">左侧函数 x 平方在闭区间零到二上可以用同一个德尔塔控制所有位置，右侧函数一除以 x 在开区间零到一上越靠近零越陡，所需德尔塔不断缩小。</desc>
  <style>
    .bg { fill: #fffdf8; }
    .frame, .axis { fill: none; stroke: #c9c1b6; stroke-width: 1.5; }
    .curve { fill: none; stroke: #d96b24; stroke-width: 5; stroke-linecap: round; }
    .input { stroke: #168aad; stroke-width: 6; }
    .output { stroke: #8b5cf6; stroke-width: 6; }
    .guide { stroke: #76695e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .point { fill: #d96b24; stroke: #fffdf8; stroke-width: 3; }
    .main { fill: #241d17; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #6e6258; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .good { fill: #08799b; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; }
    .warn { fill: #6d42c7; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171717; }
      .frame, .axis { stroke: #554d46; }
      .curve { stroke: #ff9f43; }
      .input { stroke: #66d9ef; }
      .output { stroke: #b9a0ff; }
      .guide { stroke: #b9aca0; }
      .point { fill: #ff9f43; stroke: #171717; }
      .main { fill: #f7ede2; }
      .muted { fill: #c4b7aa; }
      .good { fill: #89e4f4; }
      .warn { fill: #cbbcff; }
    }
  </style>

  <rect class="bg" width="900" height="500" rx="24"/>
  <text class="main" x="450" y="46" text-anchor="middle" font-size="30" font-weight="700">普通连续与一致连续：δ 能否与位置无关？</text>

  <text class="main" x="232" y="88" text-anchor="middle" font-size="24" font-weight="700">x²，x∈[0,2]</text>
  <rect class="frame" x="58" y="110" width="350" height="270"/>
  <line class="axis" x1="80" y1="350" x2="390" y2="350"/>
  <line class="axis" x1="80" y1="130" x2="80" y2="350"/>
  <path class="curve" d="M80 350 C165 345 265 310 380 145"/>
  <circle class="point" cx="329" cy="239" r="8"/>
  <circle class="point" cx="380" cy="145" r="8"/>
  <line class="guide" x1="329" y1="239" x2="329" y2="350"/>
  <line class="guide" x1="380" y1="145" x2="380" y2="350"/>
  <line class="input" x1="329" y1="365" x2="380" y2="365"/>
  <line class="output" x1="394" y1="145" x2="394" y2="239"/>
  <text class="good" x="354" y="395" text-anchor="middle" font-size="20">同一个 δ</text>
  <text class="muted" x="232" y="426" text-anchor="middle" font-size="18">闭区间限制住整体陡峭程度</text>
  <text class="good" x="232" y="457" text-anchor="middle" font-size="22">连续 ⇒ 一致连续</text>

  <text class="main" x="665" y="88" text-anchor="middle" font-size="24" font-weight="700">1/x，x∈(0,1]</text>
  <rect class="frame" x="492" y="110" width="350" height="270"/>
  <line class="axis" x1="514" y1="350" x2="824" y2="350"/>
  <line class="axis" x1="514" y1="130" x2="514" y2="350"/>
  <path class="curve" d="M525 130 C531 210 548 270 580 302 C630 337 720 345 824 347"/>
  <circle class="point" cx="536" cy="222" r="8"/>
  <circle class="point" cx="554" cy="278" r="8"/>
  <line class="guide" x1="536" y1="222" x2="536" y2="350"/>
  <line class="guide" x1="554" y1="278" x2="554" y2="350"/>
  <line class="input" x1="536" y1="365" x2="554" y2="365"/>
  <line class="output" x1="568" y1="222" x2="568" y2="278"/>
  <text class="warn" x="545" y="395" text-anchor="middle" font-size="20">δ 还要更小</text>
  <text class="muted" x="665" y="426" text-anchor="middle" font-size="18">越靠近 0，函数越陡</text>
  <text class="warn" x="665" y="457" text-anchor="middle" font-size="22">处处连续，但不一致连续</text>
</svg>
