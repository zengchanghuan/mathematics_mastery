<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">极限的 epsilon-delta 几何定义</title>
  <desc id="desc">对函数 f(x)=2x+1，水平带表示输出与 3 的距离小于 epsilon，竖直带表示输入与 1 的距离小于 delta。取 delta 等于 epsilon 的一半时，竖直带内的图像位于水平带中。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; font-size: 15px; }
    .frame { fill: none; stroke: #9aa0a6; stroke-width: 1.2; }
    .output-band { fill: #3275d8; fill-opacity: .14; }
    .input-band { fill: #d97721; fill-opacity: .14; }
    .output-line { stroke: #3275d8; stroke-width: 2; stroke-dasharray: 6 5; }
    .input-line { stroke: #d97721; stroke-width: 2; stroke-dasharray: 6 5; }
    .function { stroke: #2b8b57; stroke-width: 3; }
    .focus { stroke: #2b8b57; stroke-width: 6; }
    .point { fill: #fff; stroke: #202124; stroke-width: 2; }
    .label { font-weight: 600; }
  </style>
  <rect class="output-band" x="70" y="156" width="620" height="88"/>
  <rect class="input-band" x="287" y="35" width="186" height="325"/>
  <rect class="frame" x="70" y="35" width="620" height="325"/>
  <line class="output-line" x1="70" y1="156" x2="690" y2="156"/>
  <line class="output-line" x1="70" y1="244" x2="690" y2="244"/>
  <line class="input-line" x1="287" y1="35" x2="287" y2="360"/>
  <line class="input-line" x1="473" y1="35" x2="473" y2="360"/>
  <line class="function" x1="70" y1="345" x2="690" y2="55"/>
  <line class="focus" x1="287" y1="244" x2="473" y2="156"/>
  <circle class="point" cx="380" cy="200" r="6"/>
  <text x="680" y="145" text-anchor="end" class="label">L+ε</text>
  <text x="680" y="266" text-anchor="end" class="label">L−ε</text>
  <text x="281" y="390" text-anchor="end" class="label">a−δ</text>
  <text x="479" y="390" class="label">a+δ</text>
  <text x="393" y="184" class="label">(a,L)=(1,3)</text>
  <text x="565" y="88" class="label">f(x)=2x+1</text>
  <text x="70" y="414">0 &lt; |x−1| &lt; δ  ⇒  |f(x)−3| &lt; ε</text>
</svg>
